[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivy-lab"
version = "0.9.0"
description = "Assistente de engenharia Ivy com CAD paramétrico, verificação independente e memória versionada"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "pydantic>=2.0",
]

[project.scripts]
ivy = "ivy_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
